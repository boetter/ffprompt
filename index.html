<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtuelt Promptbibliotek – Finansforbundet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Virtuelt Promptbibliotek</h1>
      <p>For medlemmer af Finansforbundet – AI i praksis</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <label for="search">Søg i prompts</label>
      <input id="search" type="search" placeholder="fx kredit, AML, møde, budget..." />
      <h2>Kategorier</h2>
      <nav id="categoryList"></nav>
    </aside>

    <section>
      <div class="toolbar">
        <button id="clearFilters">Nulstil filtre</button>
        <span id="activeCategory">Alle kategorier</span>
      </div>
      <div id="promptGrid" class="grid"></div>
    </section>
  </main>

  <template id="promptCardTemplate">
    <article class="card">
      <div class="card-head">
        <h3></h3>
        <span class="badge"></span>
      </div>
      <p class="description"></p>
      <textarea readonly></textarea>
      <div class="actions">
        <button class="copyBtn">Kopiér</button>
        <a class="openBtn chatgpt" target="_blank" rel="noreferrer">Åbn i ChatGPT</a>
        <a class="openBtn claude" target="_blank" rel="noreferrer">Åbn i Claude</a>
        <a class="openBtn gemini" target="_blank" rel="noreferrer">Åbn i Gemini</a>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
