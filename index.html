<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promptbibliotek · Finansforbundet</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Virtuelt Promptbibliotek</h1>
        <p>For medlemmer af Finansforbundet · AI i praksis</p>
      </div>
      <div class="stats">
        <strong id="promptCount">0</strong>
        <span>prompts</span>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <label for="searchInput">Søg i prompts</label>
        <input id="searchInput" type="search" placeholder="fx kredit, møde, AML..." />

        <label for="categoryFilter">Kategori</label>
        <select id="categoryFilter"></select>

        <label for="sourceFilter">Kilde</label>
        <select id="sourceFilter">
          <option value="all">Alle</option>
          <option value="Brugerinput">Fra dine eksempler</option>
          <option value="Tilføjet">Tilføjede forslag</option>
        </select>

        <button id="resetBtn" class="secondary">Nulstil filtre</button>
      </aside>

      <section>
        <div id="activeFilters" class="active-filters"></div>
        <div id="cards" class="cards"></div>
      </section>
    </main>

    <template id="cardTemplate">
      <article class="card">
        <div class="card-head">
          <h3></h3>
          <span class="badge"></span>
        </div>
        <p class="meta"></p>
        <pre></pre>
        <div class="actions">
          <button class="copy">Kopiér prompt</button>
          <a class="chatgpt" target="_blank" rel="noopener">Åbn i ChatGPT</a>
          <a class="claude" target="_blank" rel="noopener">Åbn i Claude</a>
          <a class="perplexity" target="_blank" rel="noopener">Åbn i Perplexity</a>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
